name: wheels

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build wheel and source archive with firmware
        run: uv build --python 3.12
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Test wheel and source archive outside the checkout
        shell: bash
        run: |
          uv venv --python '${{ matrix.python }}' "$RUNNER_TEMP/panda-test"
          if [[ "$RUNNER_OS" == Windows ]]; then
            PYTHON="$RUNNER_TEMP/panda-test/Scripts/python.exe"
          else
            PYTHON="$RUNNER_TEMP/panda-test/bin/python"
          fi
          for PACKAGE in "$GITHUB_WORKSPACE"/dist/*; do
            uv pip install --python "$PYTHON" --reinstall "$PACKAGE"
            (cd "$RUNNER_TEMP" && "$PYTHON" "$GITHUB_WORKSPACE/tests/packaging/smoke_test.py")
          done

  publish:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.PYPI_PAT }}
