[project]
name = "pandacan"
version = "0.0.10"
description = "CAN and CAN FD from Python, powered by comma.ai panda"
readme = "README.md"
requires-python = ">=3.11,<3.13"  # macOS doesn't work with 3.13 due to pycapnp from opendbc
license = "MIT"
authors = [{name = "comma.ai"}]
classifiers = [
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
]
dependencies = [
  "libusb1",
  "libusb-package",
  "opendbc==0.3.1",
  "spidev; platform_system == 'Linux'",  # runtime dependency on comma four
]

[project.optional-dependencies]
dev = [
  "scons",
  "cffi",
  "flaky",
  "pytest",
  "pytest-xdist",
  "pytest-mock",
  "pytest-timeout",
  "ruff",
  "setuptools",
]

[dependency-groups]
# Current firmware needs safety headers newer than the PyPI release.
# Keep build-only Git dependencies out of the published Requires-Dist metadata.
firmware = [
  "opendbc @ git+https://github.com/commaai/opendbc.git@44f2987cb6ed28f7dcd99d5930abf6c2917d8f60",
  "gcc-arm-none-eabi @ git+https://github.com/commaai/dependencies.git@release-gcc-arm-none-eabi#subdirectory=gcc-arm-none-eabi",
  "cppcheck @ git+https://github.com/commaai/dependencies.git@release-cppcheck#subdirectory=cppcheck",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "packaging_backend"
backend-path = ["."]

[project.urls]
Repository = "https://github.com/commaai/panda"
Issues = "https://github.com/commaai/panda/issues"

[tool.setuptools.packages.find]
include = ["panda", "panda.*"]
namespaces = false

[tool.setuptools.package-data]
panda = ["board/health.h", "board/jungle/jungle_health.h", "board/obj/*.bin", "board/obj/*.bin.signed"]
"panda.examples" = ["*.md"]

# https://beta.ruff.rs/docs/configuration/#using-pyprojecttoml
[tool.ruff]
line-length = 160
target-version="py311"

[tool.ruff.lint]
select = ["E", "F", "W", "PIE", "C4", "ISC", "RUF100", "A"]
ignore = ["W292", "E741", "E402", "C408", "ISC003"]
flake8-implicit-str-concat.allow-multiline=false

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pytest.main".msg = "pytest.main requires special handling that is easy to mess up!"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-Werror --strict-config --strict-markers --maxprocesses=8 -nauto --durations=10 --ignore-glob='*.sh' --ignore=tests/som --ignore=tests/hitl"
python_files = "test_*.py"
testpaths = [
  "tests/"
]
