name: tests

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref != 'refs/heads/master' && github.ref || github.run_id }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  RUN: source .venv/bin/activate && /bin/bash -c

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: ./setup.sh
      - name: Build debug FW
        run: ${{ env.RUN }} "scons"
      - name: Build release FW
        run: ${{ env.RUN }} "CERT=board/certs/debug RELEASE=1 scons"

  test:
    name: ./test.sh
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['macos-latest', 'ubuntu-latest']
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: ./test.sh
